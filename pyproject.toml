[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agda-prover"
version = "0.0.1"
description = "Offline, kernel-checked Agda proof search and editor interfaces"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "AUTHORS.md", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agda-prover = "agdaprover.cli:main"
agdaprover = "agdaprover.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agdaprover*"]

[tool.setuptools.package-data]
agdaprover = ["data/toolchains/*.json", "data/models/*.apnnue"]

[tool.setuptools.data-files]
"share/agda-prover" = ["README.md", "LICENSE", "AUTHORS.md", "THIRD_PARTY_NOTICES.md"]
"share/agda-prover/licenses" = ["licenses/Agda-MIT.txt", "licenses/agda-stdlib-MIT.txt", "licenses/agda-unimath-MIT.txt", "licenses/blake2-Unlicense.txt", "licenses/cryptohash-sha256-BSD-3-Clause.txt"]
"share/agda-prover/docs" = ["docs/installation.md", "docs/interactive.md", "docs/editor-configuration.md", "docs/bundled-models.md"]
"share/agda-prover/schemas" = ["schemas/project-configuration-v1.md", "schemas/model-defaults-v1.md", "schemas/entry-tests-v1.md", "schemas/interaction-operations-v1.md"]
"share/agda-prover/examples" = ["examples/EckmannHilton.agda"]
"share/agda-prover/editor" = ["editor/agdaprover.el"]
"share/agda-prover/editor/vscode" = ["editor/vscode/package.json", "editor/vscode/extension.js", "editor/vscode/core.js", "editor/vscode/README.md", "editor/vscode/LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src/agdaprover"]
