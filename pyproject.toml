[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agda-prover"
version = "0.0.1"
description = "Offline, kernel-checked Agda proof search and editor interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agda-prover = "agdaprover.cli:main"
agdaprover = "agdaprover.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agdaprover*"]

[tool.setuptools.package-data]
agdaprover = ["data/toolchains/*.json"]

[tool.setuptools.data-files]
"share/agda-prover" = ["README.md"]
"share/agda-prover/docs" = ["docs/installation.md", "docs/interactive.md"]
"share/agda-prover/editor" = ["editor/agdaprover.el"]
"share/agda-prover/editor/vscode" = ["editor/vscode/package.json", "editor/vscode/extension.js", "editor/vscode/core.js", "editor/vscode/README.md"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src/agdaprover"]
