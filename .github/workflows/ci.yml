name: Product contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agda-smoke:
    name: Prebuilt Agda smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: ./.github/actions/setup-agda
      - run: python -m pip install .
      - name: Check fresh proof and example loading
        env:
          PYTHONPATH: tests
        run: >-
          python -W error::ResourceWarning -m unittest -v
          test_runtime.RuntimeContracts.test_fresh_proof_in_unrelated_temporary_directory
          test_examples.ExampleTests.test_example_loads_with_all_twelve_goals_outside_checkout
          test_library_environments.LibraryEnvironmentTests.test_fresh_validation_does_not_inherit_the_temporary_parent_library
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: python -m pip install . 'ruff>=0.12,<1' 'mypy>=1.17,<2'
      - run: ruff check src tests && ruff format --check src tests && mypy
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: npm --prefix editor/vscode run check && npm --prefix editor/vscode test
      - name: Install Emacs from signed Ubuntu repositories
        shell: bash
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install -y --no-install-recommends emacs-nox
      - run: ./scripts/test-emacs
